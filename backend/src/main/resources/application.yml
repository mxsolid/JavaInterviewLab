spring:
  application:
    name: java-interview-lab-backend
  profiles:
    default: local
  autoconfigure:
    # A04 才提供可迁移的数据库基线；此前禁止空骨架因缺少数据源而无法启动。
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
